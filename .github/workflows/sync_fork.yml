name: Upstream Sync

permissions:
    contents: write
    pull-requests: write

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
    group: upstream-sync
    cancel-in-progress: false

env:
    UPSTREAM_REPO: mtvpls/MoonTVPlus
    UPSTREAM_BRANCH: main
    TARGET_BRANCH: main
    SYNC_BRANCH: upstream-sync
    SEEN_BRANCH: upstream-seen

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout target repo
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  token: ${{ secrets.SYNC_TOKEN }}
                  fetch-depth: 0

            - name: Fetch upstream
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
                  git fetch upstream "${UPSTREAM_BRANCH}"
                  git fetch origin "${TARGET_BRANCH}"
                  git fetch origin "${SEEN_BRANCH}" || true

            - name: Check for unseen upstream commits
              id: check
              run: |
                  if git rev-parse --verify --quiet "origin/${SEEN_BRANCH}" >/dev/null; then
                      SEEN="origin/${SEEN_BRANCH}"
                  else
                      echo "尚未记录已审阅的上游提交，本次只建立指针，不改产品代码"
                      git push origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${SEEN_BRANCH}"
                      echo "has_updates=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "${SEEN}"; then
                      echo "上游没有新提交，跳过同步"
                      echo "has_updates=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_updates=true" >> "$GITHUB_OUTPUT"
                      git log --no-merges --pretty=format:'- %h %s' "${SEEN}..upstream/${UPSTREAM_BRANCH}" > /tmp/upstream-new.md
                  fi

            - name: Publish a notice pull request
              if: steps.check.outputs.has_updates == 'true'
              env:
                  GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
              run: |
                  git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"
                  {
                    echo "# 上游新提交"
                    echo
                    echo "这些提交来自 [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO})，只作审阅清单。"
                    echo "ApexTV 不合并上游整棵代码。需要的修复请按提交号挑选进 main。"
                    echo
                    cat /tmp/upstream-new.md
                    echo
                  } > .github/upstream-pending.md
                  git add .github/upstream-pending.md
                  git commit -m "chore: 记录待审阅的上游提交"
                  git push --force origin "${SYNC_BRANCH}"

                  PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')
                  BODY=$(cat <<EOF
                  上游 [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) 有新提交。清单写在 \`.github/upstream-pending.md\`。

                  这个 PR 不包含上游文件。不要把它当成代码合并；看完后关掉即可。指针 \`upstream-seen\` 已前进，同一批提交不会再次出现。
                  EOF
                  )
                  if [ -n "${PR_NUMBER}" ]; then
                      gh pr edit "$PR_NUMBER" --title "chore: 审阅上游 ${UPSTREAM_REPO} 新提交" --body "$BODY"
                  else
                      gh pr create \
                          --repo "$GITHUB_REPOSITORY" \
                          --base "${TARGET_BRANCH}" \
                          --head "${SYNC_BRANCH}" \
                          --title "chore: 审阅上游 ${UPSTREAM_REPO} 新提交" \
                          --body "$BODY"
                  fi
                  git push origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${SEEN_BRANCH}"
