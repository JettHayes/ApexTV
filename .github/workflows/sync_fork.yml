name: Upstream Sync

permissions:
    contents: write
    issues: write

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
    group: upstream-sync
    cancel-in-progress: false

env:
    UPSTREAM_REPO: mtvpls/MoonTVPlus
    UPSTREAM_BRANCH: main
    SEEN_TAG: upstream-seen

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout target repo
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  token: ${{ secrets.SYNC_TOKEN }}
                  fetch-depth: 0

            - name: Fetch upstream
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
                  git fetch upstream "${UPSTREAM_BRANCH}"
                  git fetch origin "refs/tags/${SEEN_TAG}:refs/tags/${SEEN_TAG}" || true

            - name: Check for unseen upstream commits
              id: check
              run: |
                  if git rev-parse --verify --quiet "refs/tags/${SEEN_TAG}" >/dev/null; then
                      SEEN="refs/tags/${SEEN_TAG}"
                  else
                      echo "尚未记录已审阅的上游提交，本次只建立指针"
                      git push origin "upstream/${UPSTREAM_BRANCH}:refs/tags/${SEEN_TAG}"
                      echo "has_updates=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "${SEEN}"; then
                      echo "上游没有新提交，跳过同步"
                      echo "has_updates=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_updates=true" >> "$GITHUB_OUTPUT"
                      git log --no-merges --pretty=format:'- %h %s' "${SEEN}..upstream/${UPSTREAM_BRANCH}" > /tmp/upstream-new.md
                  fi

            - name: Open or update an issue
              if: steps.check.outputs.has_updates == 'true'
              env:
                  GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
              run: |
                  BODY=$(cat <<EOF
                  上游 [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) 有新提交。这是审阅清单，不包含上游文件，也不需要合并。

                  看完后直接关掉这个 Issue。需要的修复按提交号挑选进 main。

                  $(cat /tmp/upstream-new.md)
                  EOF
                  )
                  ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "上游新提交 in:title" --json number --jq '.[0].number // empty')
                  if [ -n "${ISSUE_NUMBER}" ]; then
                      gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
                  else
                      gh issue create \
                          --repo "$GITHUB_REPOSITORY" \
                          --title "上游新提交" \
                          --body "$BODY"
                  fi
                  git push --force origin "upstream/${UPSTREAM_BRANCH}:refs/tags/${SEEN_TAG}"
